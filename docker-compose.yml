# 壁毯织补定位网校核
#   web    —— 长期运行的 Web 服务（浏览器页面 + /health + /api/evaluate）
#   verify —— 一次性验收服务：代码测试 + 构建检查 + 健康与校核样例冒烟，退出码即验收结论
services:
  web:
    build: .
    image: tapestry-grid-checker
    environment:
      PORT: 8080
    ports:
      # 宿主机端口可配置：HOST_PORT=9090 docker compose up web（默认 8080）
      - "${HOST_PORT:-8080}:8080"
    restart: unless-stopped
    # 健康检查继承自镜像的 HEALTHCHECK（GET /health）

  verify:
    build: .
    image: tapestry-grid-checker
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: http://web:8080
    command: ["node", "verify.js"]
    restart: "no"
